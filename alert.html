<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Monitor - Change Detected</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(17, 24, 39, 0.95);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --ring-color: rgba(37, 99, 235, 0.4);
      --badge-bg: rgba(37, 99, 235, 0.15);
      --badge-text: #60a5fa;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 90%;
      max-width: 400px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 40px rgba(37, 99, 235, 0.15);
      backdrop-filter: blur(16px);
      text-align: center;
      animation: appear 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(0.94) translateY(8px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .icon-wrapper {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      border-radius: 14px;
      background: rgba(37, 99, 235, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .pulse-ring {
      position: absolute;
      inset: -4px;
      border-radius: 18px;
      border: 2px solid var(--accent);
      opacity: 0.8;
      animation: pulse 2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.12); opacity: 0; }
      100% { transform: scale(1.15); opacity: 0; }
    }

    .icon-wrapper svg {
      width: 28px;
      height: 28px;
      stroke: #3b82f6;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      background: var(--badge-bg);
      color: var(--badge-text);
      margin-bottom: 12px;
    }

    .status-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #60a5fa;
    }

    h1 {
      font-size: 19px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .url-box {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px 14px;
      margin: 14px 0;
      font-size: 13px;
      color: var(--text-muted);
      word-break: break-all;
      max-height: 72px;
      overflow-y: auto;
      text-align: left;
      line-height: 1.45;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .timestamp {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 22px;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      height: 40px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-primary:focus {
      outline: 2px solid #93c5fd;
      outline-offset: 2px;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.07);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #f8fafc;
    }

    .shortcut-hint {
      font-size: 11px;
      opacity: 0.6;
      margin-left: 2px;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrapper">
      <div class="pulse-ring"></div>
      <svg viewBox="0 0 24 24">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
    </div>

    <div class="status-badge" id="typeBadge">
      <span class="dot"></span>
      <span id="badgeText">Content Changed</span>
    </div>

    <h1 id="pageTitle">Webpage Updated</h1>

    <div class="url-box" id="urlBox">Loading...</div>

    <div class="timestamp" id="timeBox">Just now</div>

    <div class="actions">
      <button class="btn-primary" id="openBtn">
        Open Page <span class="shortcut-hint">(↵)</span>
      </button>
      <button class="btn-secondary" id="closeBtn">
        Dismiss <span class="shortcut-hint">(Esc)</span>
      </button>
    </div>
  </div>

  <script src="alert.js"></script>
</body>
</html>
